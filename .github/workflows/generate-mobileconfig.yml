name: Build Paraguay VPN mobileconfig

on:
  push:
    branches: [main]
    paths:
      - "vpn-servers.json"
      - ".github/workflows/generate-mobileconfig.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release に添付するタグ名（空なら添付しない）"
        required: false
        default: ""

permissions:
  contents: write   # Release 添付に必要

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON
        run: python3 -c "import json; json.load(open('vpn-servers.json'))"

      - name: Generate .mobileconfig (inline Python)
        env:
          VPN_PSK: ${{ secrets.VPN_PSK }}
        run: |
          python3 << 'PYEOF'
          #!/usr/bin/env python3
          """vpn-servers.json から iOS 用 .mobileconfig (IKEv2) を生成する。"""
          import json
          import os
          import pathlib
          import plistlib
          import sys
          import uuid

          SECRET_PLACEHOLDER = "REPLACE_WITH_SECRET"
          SRC = "vpn-servers.json"
          OUTDIR = pathlib.Path("output")


          def deterministic_uuid(seed: str) -> str:
              """同じサーバーなら毎回同じ UUID になるようにする。"""
              return str(uuid.uuid5(uuid.NAMESPACE_URL, f"paraguay-vpn:{seed}"))


          def resolve_secret(server: dict) -> str:
              secret = server.get("sharedSecret") or SECRET_PLACEHOLDER
              if secret != SECRET_PLACEHOLDER:
                  return secret
              env_secret = os.environ.get("VPN_PSK")
              if not env_secret:
                  print(
                      f"[warn] {server['id']}: VPN_PSK 未設定。プレースホルダのまま出力します。",
                      file=sys.stderr,
                  )
                  return SECRET_PLACEHOLDER
              return env_secret


          def build_profile(server: dict) -> dict:
              sid = server["id"]
              host = server["host"]
              name = server.get("name", sid)
              org = server.get("organization", "Example Org")
              local_id = server.get("localIdentifier", "ios-client")
              remote_id = server.get("remoteIdentifier", host)
              secret = resolve_secret(server)

              vpn_payload = {
                  # --- ペイロード共通メタデータ ---
                  "PayloadType": "com.apple.vpn.managed",
                  "PayloadVersion": 1,
                  "PayloadIdentifier": f"com.example.paraguay.vpn.{sid}",
                  "PayloadUUID": deterministic_uuid(f"vpn-payload:{sid}"),
                  "PayloadDisplayName": name,
                  "PayloadOrganization": org,

                  # --- VPN 基本設定 ---
                  "UserDefinedName": name,
                  "VPNType": "IKEv2",
                  "RemoteAddress": host,          # 互換用（新しめのiOSはIKEv2側を見る）

                  # --- IKEv2 固有設定（ここに集約するのが重要） ---
                  "IKEv2": {
                      "AuthenticationMethod": "SharedSecret",
                      "RemoteAddress": host,      # ★ これが無いと Missing server address
                      "RemoteIdentifier": remote_id,
                      "LocalIdentifier": local_id,
                      "SharedSecret": secret,
                      "DeadPeerDetectionRate": "Medium",
                      "DisableMOBIKE": 0,
                      "DisableRedirect": 0,
                      "EnablePFS": 0,
                      "EnableRevocationCheck": 0,
                      "NATKeepAliveOffloadEnable": 0,
                      "NATKeepAliveInterval": 30,
                  },

                  # --- IPv4 ---
                  "IPv4": {"OverridePrimary": 1},
              }

              return {
                  "PayloadContent": [vpn_payload],
                  "PayloadType": "Configuration",
                  "PayloadIdentifier": f"com.example.paraguay.profile.{sid}",
                  "PayloadUUID": deterministic_uuid(f"profile:{sid}"),
                  "PayloadDisplayName": f"{name} Profile",
                  "PayloadOrganization": org,
                  "PayloadDescription": "IKEv2 VPN profile (auto-generated)",
                  "PayloadVersion": 1,
              }


          def main() -> int:
              OUTDIR.mkdir(parents=True, exist_ok=True)

              with open(SRC, encoding="utf-8") as f:
                  data = json.load(f)

              servers = data.get("servers", [])
              if not servers:
                  print("[error] servers が空です", file=sys.stderr)
                  return 1

              generated = 0
              for server in servers:
                  missing = [k for k in ("id", "host") if k not in server]
                  if missing:
                      print(f"[error] 必須キー欠落 {missing}: {server}", file=sys.stderr)
                      return 1

                  profile = build_profile(server)
                  out = OUTDIR / f"Paraguay-VPN-{server['id']}.mobileconfig"
                  with open(out, "wb") as f:
                      plistlib.dump(profile, f, fmt=plistlib.FMT_XML)
                  print(f"[ok] {out}")
                  generated += 1

              print(f"[done] {generated} profile(s) generated into {OUTDIR}/")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PYEOF

      - name: Verify RemoteAddress in IKEv2
        run: |
          set -euo pipefail
          fail=0
          for f in output/*.mobileconfig; do
            if plutil -p "$f" 2>/dev/null | grep -q "IKEv2"; then
              # IKEv2 ブロック内の RemoteAddress を簡易チェック
              if ! plutil -p "$f" | awk '/"IKEv2" =>/,/^  }/' | grep -q '"RemoteAddress"'; then
                echo "[ng] $f : IKEv2.RemoteAddress がありません"
                fail=1
              else
                echo "[ok] $f"
              fi
            fi
          done
          exit $fail

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paraguay-vpn-mobileconfig
          path: output/*.mobileconfig
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release (optional)
        if: ${{ github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" output/*.mobileconfig --clobber
          else
            gh release create "$TAG" output/*.mobileconfig \
              --title "Paraguay VPN profiles $TAG" \
              --notes "Auto-generated .mobileconfig files"
          fi
