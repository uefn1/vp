name: Scrape Paraguay OpenVPN profiles

on:
  workflow_dispatch:
    inputs:
      skip_check:
        description: "疎通チェックをスキップ（全 T_ 扱い）"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "GitHub Release に添付するタグ名（空なら添付しない）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate .ovpn files (OpenProxyList + VPN Gate)
        env:
          SKIP_CHECK: ${{ github.event.inputs.skip_check == 'true' && '1' || '0' }}
        run: |
          python3 << 'PYEOF'
          import base64
          import csv
          import io
          import json
          import os
          import pathlib
          import re
          import socket
          import sys
          import time
          import urllib.request

          # ---- 設定 ----
          OPENPROXYLIST_LIST_URL = "https://openproxylist.com/openvpn/"
          OPENPROXYLIST_DOWNLOAD_BASE = "https://openproxylist.com/openvpn/download/"
          VPNGATE_API = "http://www.vpngate.net/api/iphone/"
          MIRROR_CSV = "https://cdn.jsdelivr.net/gh/GeorgeXie2333/vpngate-list-mirror@latest/data/vpngate.csv"
          COUNTRY = "PY"
          OUTDIR = pathlib.Path("output")
          TIMEOUT = 20
          SKIP_CHECK = os.environ.get("SKIP_CHECK", "0") == "1"

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/120.0 Safari/537.36"
              ),
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
          }

          def fetch(url, as_bytes=False):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                  data = resp.read()
              return data if as_bytes else data.decode("utf-8", errors="replace")

          # ============================================================
          # Source 1: OpenProxyList (download/{id} から .ovpn を直接取得)
          # ============================================================
          def scrape_openproxylist_download_ids():
              """OpenVPNリストページから download/{id} の ID を抽出する。"""
              try:
                  html = fetch(OPENPROXYLIST_LIST_URL)
              except Exception as e:
                  print(f"[warn] OpenProxyList list fetch failed: {e}", file=sys.stderr)
                  return []

              ids = set(re.findall(r'/openvpn/download/(\d+)', html))
              if not ids:
                  ids = set(re.findall(r'"id"\s*:\s*(\d+)', html))
              if not ids:
                  print(
                      "[warn] OpenProxyList: download ID を抽出できませんでした。既知のIDを使用します。",
                      file=sys.stderr,
                  )
                  ids = {"1442599"}

              return sorted(ids, key=int)

          def download_ovpn_from_openproxylist(server_id):
              """download/{id} から .ovpn を取得する。"""
              url = f"{OPENPROXYLIST_DOWNLOAD_BASE}{server_id}"
              try:
                  content = fetch(url)
                  if "client" in content and "remote " in content:
                      return content
              except Exception as e:
                  print(f"[warn] OpenProxyList download failed id={server_id}: {e}", file=sys.stderr)
              return None

          # ============================================================
          # Source 2: VPN Gate (補助、0件でもエラーにしない)
          # ============================================================
          def fetch_vpngate_csv():
              for url in (VPNGATE_API, MIRROR_CSV):
                  try:
                      raw = fetch(url)
                      print(f"[info] VPN Gate fetched from {url} ({len(raw)} bytes)", flush=True)
                      return raw
                  except Exception as e:
                      print(f"[warn] VPN Gate fetch failed {url}: {e}", file=sys.stderr)
              return None

          def parse_vpngate_csv(raw):
              lines = [
                  ln for ln in raw.replace("\r", "").split("\n")
                  if ln and not ln.startswith("*")
              ]
              if not lines:
                  return []
              header_line = lines[0]
              if header_line.startswith("#"):
                  header_line = header_line[1:]
              reader = csv.DictReader(io.StringIO("\n".join([header_line] + lines[1:])))
              return list(reader)

          def decode_vpngate_ovpn(row):
              b64 = row.get("OpenVPN_ConfigData_Base64", "")
              if not b64:
                  return None
              try:
                  return base64.b64decode(b64).decode("utf-8", errors="replace")
              except Exception:
                  return None

          # ============================================================
          # 疎通チェック
          # ============================================================
          def check_tcp(host, port, timeout=5):
              try:
                  with socket.create_connection((host, port), timeout=timeout):
                      return True
              except Exception:
                  return False

          def check_udp(host, port, timeout=5):
              """OpenVPN P_CONTROL_HARD_RESET_CLIENT_V2 (0x38) で応答確認。"""
              sock = None
              try:
                  sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                  sock.settimeout(timeout)
                  pkt = (
                      bytes([0x38])
                      + os.urandom(8)
                      + (0).to_bytes(4, "big")
                      + (0).to_bytes(4, "big")
                  )
                  sock.sendto(pkt, (host, port))
                  data, _ = sock.recvfrom(2048)
                  return len(data) > 0
              except Exception:
                  return False
              finally:
                  if sock is not None:
                      try:
                          sock.close()
                      except Exception:
                          pass

          def check_availability(host, port, proto):
              if SKIP_CHECK:
                  return True, "skip"
              tcp_ok = check_tcp(host, port)
              udp_ok = check_udp(host, port)
              return (tcp_ok or udp_ok), f"tcp={tcp_ok} udp={udp_ok}"

          def parse_remote(ovpn):
              host, port, proto = None, 1194, "udp"
              for line in ovpn.splitlines():
                  line = line.strip()
                  if line.startswith("remote "):
                      parts = line.split()
                      if len(parts) >= 3:
                          host = parts[1]
                          try:
                              port = int(parts[2])
                          except ValueError:
                              pass
                          proto = parts[3] if len(parts) >= 4 else "udp"
                      break
                  if line.startswith("proto "):
                      proto = line.split()[1]
              return host, port, proto

          # ============================================================
          # メイン
          # ============================================================
          def main():
              OUTDIR.mkdir(parents=True, exist_ok=True)
              checks = {}
              generated = 0

              # --- Source 1: OpenProxyList ---
              ids = scrape_openproxylist_download_ids()
              print(f"[info] OpenProxyList download IDs: {len(ids)} 件", flush=True)

              for sid in ids:
                  ovpn = download_ovpn_from_openproxylist(sid)
                  if not ovpn:
                      continue
                  host, port, proto = parse_remote(ovpn)
                  if not host:
                      continue
                  key = f"opl-{sid}"
                  available, detail = check_availability(host, port, proto)
                  prefix = "T" if available else "F"
                  checks[key] = {
                      "available": available,
                      "host": host,
                      "port": port,
                      "proto": proto,
                      "detail": detail,
                      "prefix": prefix,
                      "source": "openproxylist",
                  }
                  out = OUTDIR / f"{prefix}_Paraguay-{key}.ovpn"
                  out.write_text(ovpn, encoding="utf-8")
                  generated += 1
                  print(f"[{prefix}] {key} {host}:{port}/{proto} :: {detail} -> {out}", flush=True)
                  if not SKIP_CHECK:
                      time.sleep(0.5)

              # --- Source 2: VPN Gate (補助) ---
              raw = fetch_vpngate_csv()
              if raw:
                  rows = parse_vpngate_csv(raw)
                  py_rows = [
                      r for r in rows
                      if (r.get("CountryShort") or "").strip().strip('"').upper() == COUNTRY
                  ]
                  print(f"[info] VPN Gate Paraguay servers: {len(py_rows)} 件", flush=True)

                  for row in py_rows:
                      host_ip = (row.get("IP") or "").strip()
                      if not host_ip:
                          continue
                      ovpn = decode_vpngate_ovpn(row)
                      if not ovpn:
                          continue
                      h, port, proto = parse_remote(ovpn)
                      if not h:
                          h = host_ip
                      key = f"vg-{h.replace('.', '-')}"
                      available, detail = check_availability(h, port, proto)
                      prefix = "T" if available else "F"
                      checks[key] = {
                          "available": available,
                          "host": h,
                          "port": port,
                          "proto": proto,
                          "detail": detail,
                          "prefix": prefix,
                          "source": "vpngate",
                      }
                      out = OUTDIR / f"{prefix}_Paraguay-{key}.ovpn"
                      out.write_text(ovpn, encoding="utf-8")
                      generated += 1
                      print(f"[{prefix}] {key} {h}:{port}/{proto} :: {detail} -> {out}", flush=True)
                      if not SKIP_CHECK:
                          time.sleep(0.5)

              json.dump(
                  checks,
                  open("checks.json", "w", encoding="utf-8"),
                  indent=2,
                  ensure_ascii=False,
              )
              ok = sum(1 for v in checks.values() if v["available"])
              print(f"[done] generated={generated} reachable={ok}/{len(checks)}")
              return 0 if generated > 0 else 1

          if __name__ == "__main__":
              raise SystemExit(main())
          PYEOF

      - name: Summary
        if: always()
        run: |
          echo "=== Availability ==="
          if [ -f checks.json ]; then
            python3 - << 'PYEOF'
          import json
          d = json.load(open("checks.json"))
          for k, v in d.items():
              flag = "T" if v["available"] else "F"
              print(f"{flag} {k} {v['host']}:{v['port']} [{v.get('source','?')}] :: {v['detail']}")
          PYEOF
          fi
          echo "=== Output files ==="
          ls -la output/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paraguay-ovpn
          path: |
            output/*.ovpn
            checks.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release (optional)
        if: ${{ github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" output/*.ovpn checks.json --clobber
          else
            gh release create "$TAG" output/*.ovpn checks.json \
              --title "Paraguay OpenVPN profiles $TAG" \
              --notes "T_ = reachable, F_ = not reachable at build time. Sources: OpenProxyList, VPN Gate."
          fi
