name: Build Paraguay VPN mobileconfig

on:
  push:
    branches: [main]
    paths:
      - "vpn-servers.json"
      - ".github/workflows/generate-mobileconfig.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release に添付するタグ名（空なら添付しない）"
        required: false
        default: ""
      skip_check:
        description: "疎通チェックをスキップ（全サーバー T_ 扱い）"
        type: boolean
        required: false
        default: false
      use_inline_json:
        description: "YAML 内蔵の JSON を使う（リポジトリの vpn-servers.json を無視）"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ping
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iputils-ping

      # --- YAML 内蔵 JSON を vpn-servers.generated.json として書き出す ---
      - name: Emit inline JSON (fallback / override)
        run: |
          cat > vpn-servers.inline.json << 'JSONEOF'
          {
            "description": "Paraguay free VPN endpoints (publicly listed, availability not guaranteed)",
            "updated": "2026-11-02",
            "defaults": {
              "protocol": "IKEv2",
              "localIdentifier": "ios-client",
              "sharedSecret": "REPLACE_WITH_SECRET",
              "organization": "Example Org"
            },
            "servers": [
              { "id": "py-01", "name": "Paraguay VPN 01", "host": "181.94.248.79" },
              { "id": "py-02", "name": "Paraguay VPN 02", "host": "181.94.225.32" },
              { "id": "py-03", "name": "Paraguay VPN 03", "host": "181.94.248.28" },
              { "id": "py-04", "name": "Paraguay VPN 04", "host": "200.108.133.222" },
              { "id": "py-05", "name": "Paraguay VPN 05", "host": "181.91.85.141" },
              { "id": "py-06", "name": "Paraguay VPN 06", "host": "181.91.86.141" },
              { "id": "py-07", "name": "Paraguay VPN 07", "host": "181.94.224.201" },
              { "id": "py-08", "name": "Paraguay VPN 08", "host": "181.94.248.80" },
              { "id": "py-09", "name": "Paraguay VPN 09", "host": "181.94.249.10" },
              { "id": "py-10", "name": "Paraguay VPN 10", "host": "181.91.84.60"  },
              { "id": "py-11", "name": "Paraguay VPN 11", "host": "vpn845980874.opengw.net" },
              { "id": "py-12", "name": "Paraguay VPN 12", "host": "vpn772349376.opengw.net" }
            ]
          }
          JSONEOF

      - name: Select source JSON
        id: pick
        run: |
          USE_INLINE="${{ github.event.inputs.use_inline_json }}"
          if [ "$USE_INLINE" = "true" ] || [ ! -f vpn-servers.json ]; then
            cp vpn-servers.inline.json vpn-servers.effective.json
            echo "source=inline" >> "$GITHUB_OUTPUT"
          else
            cp vpn-servers.json vpn-servers.effective.json
            echo "source=repo" >> "$GITHUB_OUTPUT"
          fi
          echo "[info] source=$([ "$USE_INLINE" = "true" ] && echo inline || echo repo)"

      - name: Validate JSON
        run: python3 -c "import json; json.load(open('vpn-servers.effective.json'))"

      # --- skip_check=true：全 T ---
      - name: Init checks.json (skip mode)
        if: ${{ github.event.inputs.skip_check == 'true' }}
        run: |
          python3 << 'PYEOF'
          import json
          data = json.load(open("vpn-servers.effective.json", encoding="utf-8"))
          results = {
              s["id"]: {"available": True, "host": s["host"], "detail": "skip", "prefix": "T"}
              for s in data.get("servers", [])
          }
          json.dump(results, open("checks.json", "w", encoding="utf-8"), indent=2)
          print("[info] skip_check=true; all servers marked T")
          PYEOF

      # --- 疎通チェック ---
      - name: Check VPN availability
        if: ${{ github.event.inputs.skip_check != 'true' }}
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import json, socket, struct, subprocess, sys, time

          SRC = "vpn-servers.effective.json"
          OUT = "checks.json"

          def resolve(host):
              try:
                  return socket.gethostbyname(host)
              except socket.gaierror:
                  return None

          def ping_host(host, timeout=3):
              try:
                  r = subprocess.run(["ping", "-c", "1", "-W", str(timeout), host],
                                     capture_output=True, timeout=timeout + 2)
                  return r.returncode == 0
              except Exception:
                  return False

          def check_ike_udp(host, port, timeout=5):
              try:
                  addr = (socket.gethostbyname(host), port)
              except socket.gaierror:
                  return False
              sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              sock.settimeout(timeout)
              try:
                  i_spi = struct.pack("!Q", 0x1122334455667788)
                  r_spi = b"\x00" * 8
                  hdr = (i_spi + r_spi + b"\x00" + b"\x20" + b"\x22" + b"\x08"
                         + struct.pack("!I", 0) + struct.pack("!I", 28))
                  packet = hdr if port == 500 else b"\x00\x00\x00\x00" + hdr
                  sock.sendto(packet, addr)
                  sock.recvfrom(2048)
                  return True
              except Exception:
                  return False
              finally:
                  sock.close()

          def check_server(host):
              ip = resolve(host)
              if not ip:
                  return False, "dns-fail"
              ping_ok = ping_host(host, timeout=3)
              ike_500 = check_ike_udp(host, 500, timeout=5)
              ike_4500 = check_ike_udp(host, 4500, timeout=5)
              available = ike_500 or ike_4500
              detail = f"ip={ip} ping={ping_ok} ike500={ike_500} ike4500={ike_4500}"
              return available, detail

          def main():
              data = json.load(open(SRC, encoding="utf-8"))
              servers = data.get("servers", [])
              results = {}
              for s in servers:
                  sid, host = s["id"], s["host"]
                  available, detail = check_server(host)
                  prefix = "T" if available else "F"
                  results[sid] = {"available": available, "host": host, "detail": detail, "prefix": prefix}
                  print(f"[{'T' if available else 'F'}] {sid} {host} :: {detail}", flush=True)
                  time.sleep(1)
              json.dump(results, open(OUT, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
              ok = sum(1 for r in results.values() if r["available"])
              print(f"[done] {ok}/{len(results)} servers reachable")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PYEOF

      - name: Ensure checks.json exists
        if: ${{ hashFiles('checks.json') == '' }}
        run: |
          python3 << 'PYEOF'
          import json
          data = json.load(open("vpn-servers.effective.json", encoding="utf-8"))
          results = {
              s["id"]: {"available": False, "host": s["host"], "detail": "check-not-run", "prefix": "F"}
              for s in data.get("servers", [])
          }
          json.dump(results, open("checks.json", "w", encoding="utf-8"), indent=2)
          print("[warn] checks.json not found; all servers marked F")
          PYEOF

      # --- .mobileconfig 生成（defaults マージ + prefix 反映） ---
      - name: Generate .mobileconfig (inline Python)
        env:
          VPN_PSK: ${{ secrets.VPN_PSK }}
        run: |
          python3 << 'PYEOF'
          import json, os, pathlib, plistlib, sys, uuid

          SECRET_PLACEHOLDER = "REPLACE_WITH_SECRET"
          SRC = "vpn-servers.effective.json"
          CHECKS = "checks.json"
          OUTDIR = pathlib.Path("output")

          def deterministic_uuid(seed):
              return str(uuid.uuid5(uuid.NAMESPACE_URL, f"paraguay-vpn:{seed}"))

          def merge(server, defaults):
              merged = dict(defaults or {})
              merged.update(server)
              return merged

          def resolve_secret(server):
              secret = server.get("sharedSecret") or SECRET_PLACEHOLDER
              if secret != SECRET_PLACEHOLDER:
                  return secret
              env_secret = os.environ.get("VPN_PSK")
              if not env_secret:
                  print(f"[warn] {server['id']}: VPN_PSK 未設定。プレースホルダ出力", file=sys.stderr)
                  return SECRET_PLACEHOLDER
              return env_secret

          def build_profile(server):
              sid = server["id"]
              host = server["host"]
              name = server.get("name", sid)
              org = server.get("organization", "Example Org")
              local_id = server.get("localIdentifier", "ios-client")
              remote_id = server.get("remoteIdentifier", host)
              secret = resolve_secret(server)

              vpn_payload = {
                  "PayloadType": "com.apple.vpn.managed",
                  "PayloadVersion": 1,
                  "PayloadIdentifier": f"com.example.paraguay.vpn.{sid}",
                  "PayloadUUID": deterministic_uuid(f"vpn-payload:{sid}"),
                  "PayloadDisplayName": name,
                  "PayloadOrganization": org,
                  "UserDefinedName": name,
                  "VPNType": "IKEv2",
                  "RemoteAddress": host,
                  "IKEv2": {
                      "AuthenticationMethod": "SharedSecret",
                      "RemoteAddress": host,
                      "RemoteIdentifier": remote_id,
                      "LocalIdentifier": local_id,
                      "SharedSecret": secret,
                      "DeadPeerDetectionRate": "Medium",
                      "DisableMOBIKE": 0,
                      "DisableRedirect": 0,
                      "EnablePFS": 0,
                      "EnableRevocationCheck": 0,
                      "NATKeepAliveOffloadEnable": 0,
                      "NATKeepAliveInterval": 30,
                  },
                  "IPv4": {"OverridePrimary": 1},
              }
              return {
                  "PayloadContent": [vpn_payload],
                  "PayloadType": "Configuration",
                  "PayloadIdentifier": f"com.example.paraguay.profile.{sid}",
                  "PayloadUUID": deterministic_uuid(f"profile:{sid}"),
                  "PayloadDisplayName": f"{name} Profile",
                  "PayloadOrganization": org,
                  "PayloadDescription": "IKEv2 VPN profile (auto-generated)",
                  "PayloadVersion": 1,
              }

          def main():
              OUTDIR.mkdir(parents=True, exist_ok=True)
              data = json.load(open(SRC, encoding="utf-8"))
              defaults = data.get("defaults", {})
              checks = json.load(open(CHECKS, encoding="utf-8")) if os.path.exists(CHECKS) else {}
              servers = data.get("servers", [])
              if not servers:
                  print("[error] servers が空", file=sys.stderr)
                  return 1
              for raw in servers:
                  server = merge(raw, defaults)
                  sid = server["id"]
                  prefix = checks.get(sid, {}).get("prefix", "F")
                  profile = build_profile(server)
                  out = OUTDIR / f"{prefix}_Paraguay-VPN-{sid}.mobileconfig"
                  with open(out, "wb") as f:
                      plistlib.dump(profile, f, fmt=plistlib.FMT_XML)
                  print(f"[ok] {out}")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PYEOF

      - name: Summary
        if: always()
        run: |
          echo "=== Availability ==="
          if [ -f checks.json ]; then
            python3 -c "import json;d=json.load(open('checks.json'));[print(('T' if v['available'] else 'F')+' '+k+' '+v['host']+' :: '+v['detail']) for k,v in d.items()]"
          fi
          echo "=== Output files ==="
          ls -la output/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paraguay-vpn-mobileconfig
          path: |
            output/*.mobileconfig
            checks.json
            vpn-servers.effective.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release (optional)
        if: ${{ github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" output/*.mobileconfig checks.json vpn-servers.effective.json --clobber
          else
            gh release create "$TAG" output/*.mobileconfig checks.json vpn-servers.effective.json \
              --title "Paraguay VPN profiles $TAG" \
              --notes "T_ = reachable (IKE responded), F_ = not reachable at build time"
          fi
