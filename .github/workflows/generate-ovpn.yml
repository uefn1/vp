name: Scrape Paraguay OpenVPN profiles

on:
  # cron は削除。手動実行のみ
  workflow_dispatch:
    inputs:
      skip_check:
        description: "疎通チェックをスキップ（全 T_ 扱い）"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "GitHub Release に添付するタグ名（空なら添付しない）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape & generate .ovpn
        env:
          SKIP_CHECK: ${{ github.event.inputs.skip_check == 'true' && '1' || '0' }}
        run: |
          python3 << 'PYEOF'
          import base64
          import csv
          import io
          import json
          import os
          import pathlib
          import socket
          import sys
          import time
          import urllib.request

          VPNGATE_API = "http://www.vpngate.net/api/iphone/"
          MIRROR_CSV = "https://cdn.jsdelivr.net/gh/GeorgeXie2333/vpngate-list-mirror@latest/data/vpngate.csv"
          COUNTRY = "PY"          # Paraguay
          OUTDIR = pathlib.Path("output")
          TIMEOUT = 10
          SKIP_CHECK = os.environ.get("SKIP_CHECK", "0") == "1"

          def fetch_csv():
              for url in (VPNGATE_API, MIRROR_CSV):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                          raw = resp.read().decode("utf-8", errors="replace")
                      print(f"[info] fetched from {url} ({len(raw)} bytes)", flush=True)
                      return raw
                  except Exception as e:
                      print(f"[warn] fetch failed {url}: {e}", file=sys.stderr)
              raise SystemExit("[error] CSV を取得できませんでした")

          def parse_csv(raw):
              lines = [ln for ln in raw.replace("\r", "").split("\n") if ln and not ln.startswith("*")]
              if not lines:
                  return []
              header_line = lines[0]
              if header_line.startswith("#"):
                  header_line = header_line[1:]
              reader = csv.DictReader(io.StringIO("\n".join([header_line] + lines[1:])))
              return list(reader)

          def decode_ovpn(row):
              b64 = row.get("OpenVPN_ConfigData_Base64", "")
              if not b64:
                  return None
              try:
                  return base64.b64decode(b64).decode("utf-8", errors="replace")
              except Exception:
                  return None

          def check_tcp(host, port, timeout=5):
              try:
                  with socket.create_connection((host, port), timeout=timeout):
                      return True
              except Exception:
                  return False

          def check_udp(host, port, timeout=5):
              try:
                  sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                  sock.settimeout(timeout)
                  pkt = bytes([0x38]) + os.urandom(8) + (0).to_bytes(4, "big") + (0).to_bytes(4, "big")
                  sock.sendto(pkt, (host, port))
                  data, _ = sock.recvfrom(2048)
                  return len(data) > 0
              except Exception:
                  return False
              finally:
                  try:
                      sock.close()
                  except Exception:
                      pass

          def check_availability(host, port, proto):
              if SKIP_CHECK:
                  return True, "skip"
              tcp_ok = check_tcp(host, port)
              udp_ok = check_udp(host, port)
              return (tcp_ok or udp_ok), f"tcp={tcp_ok} udp={udp_ok}"

          def main():
              OUTDIR.mkdir(parents=True, exist_ok=True)
              raw = fetch_csv()
              rows = parse_csv(raw)

              py_rows = [r for r in rows if (r.get("CountryShort") or "").strip() == COUNTRY]
              if not py_rows:
                  print(f"[error] パラグアイ({COUNTRY})のサーバーが見つかりません", file=sys.stderr)
                  return 1

              print(f"[info] Paraguay servers: {len(py_rows)}", flush=True)

              checks = {}
              generated = 0

              for row in py_rows:
                  host = (row.get("IP") or "").strip()
                  if not host:
                      continue
                  sid = host.replace(".", "-")
                  ovpn = decode_ovpn(row)
                  if not ovpn:
                      print(f"[warn] {sid}: OpenVPN設定が空のためスキップ", file=sys.stderr)
                      continue

                  port, proto = 1194, "udp"
                  for line in ovpn.splitlines():
                      line = line.strip()
                      if line.startswith("remote "):
                          parts = line.split()
                          if len(parts) >= 3:
                              host = parts[1]
                              try:
                                  port = int(parts[2])
                              except ValueError:
                                  pass
                              proto = parts[3] if len(parts) >= 4 else "udp"
                          break
                      if line.startswith("proto "):
                          proto = line.split()[1]

                  available, detail = check_availability(host, port, proto)
                  prefix = "T" if available else "F"
                  checks[sid] = {
                      "available": available, "host": host, "port": port,
                      "proto": proto, "detail": detail, "prefix": prefix,
                  }

                  out = OUTDIR / f"{prefix}_Paraguay-{sid}.ovpn"
                  out.write_text(ovpn, encoding="utf-8")
                  generated += 1
                  print(f"[{prefix}] {sid} {host}:{port}/{proto} :: {detail} -> {out}", flush=True)
                  if not SKIP_CHECK:
                      time.sleep(0.5)

              json.dump(checks, open("checks.json", "w", encoding="utf-8"), indent=2, ensure_ascii=False)
              ok = sum(1 for v in checks.values() if v["available"])
              print(f"[done] generated={generated} reachable={ok}/{len(checks)}")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PYEOF

      - name: Summary
        if: always()
        run: |
          echo "=== Availability ==="
          if [ -f checks.json ]; then
            python3 -c "import json;d=json.load(open('checks.json'));[print(('T' if v['available'] else 'F')+' '+k+' '+v['host']+' :: '+v['detail']) for k,v in d.items()]"
          fi
          echo "=== Output files ==="
          ls -la output/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paraguay-ovpn
          path: |
            output/*.ovpn
            checks.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release (optional)
        if: ${{ github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" output/*.ovpn checks.json --clobber
          else
            gh release create "$TAG" output/*.ovpn checks.json \
              --title "Paraguay OpenVPN profiles $TAG" \
              --notes "T_ = reachable, F_ = not reachable at build time. Import into OpenVPN Connect on iOS."
          fi
